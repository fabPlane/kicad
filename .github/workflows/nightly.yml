#
# Nightly binaries of the headless server: `kicad-cli` + the pcbnew, eeschema and cvpcb
# kifaces, for Linux, macOS and Windows, published as GitHub Releases of this repository.
#
#   nightly-<YYYYMMDD>-<sha10>   one prerelease per build (pinnable; pruned after KEEP_DAYS)
#   nightly                      rolling prerelease that always carries the latest assets
#                                under stable names, plus manifest.json for consumers
#
# Two checkouts per job: the *sources* to build (main by default, or the `ref` input,
# which may be a commit from before this pipeline existed) at the workspace root, and the
# *tooling* (tools/nightly of the commit this workflow file comes from) in nightly-tools/.
# Everything platform-specific lives in tools/nightly/ so it can be run by hand; this file
# only wires the jobs together.  See tools/nightly/README.md for the archive layout, the
# manifest format, the consumer contract and how a consumer (fabdesk, fab_pcb) pulls a
# build in.
#
name: Nightly kicad-cli

on:
  schedule:
    # 02:17 UTC every day.  A build whose commit the rolling `nightly` release already
    # carries for every platform is skipped, so an idle branch costs one short job.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (default: main); any commit works, even one older than tools/nightly"
        type: string
        default: ""
      force:
        description: "Build even if the nightly release already carries this commit"
        type: boolean
        default: false
      platforms:
        description: "Comma-separated subset of linux-x86_64,macos-arm64,macos-x86_64,windows-x86_64 (empty = all)"
        type: string
        default: ""

permissions:
  contents: write

# Never two nightlies at once (they would race on the rolling release); queue instead.
concurrency:
  group: nightly-release
  cancel-in-progress: false

env:
  # The branch the schedule builds.  main carries the API patch series that fab_pcb and
  # fabdesk pin; the workflow file itself is read from the default branch.
  NIGHTLY_REF: main
  # Where the second checkout puts tools/nightly; scripts are run from here, never from the
  # source checkout, so a commit that predates the pipeline can still be built.
  NIGHTLY_TOOLS: ${{ github.workspace }}/nightly-tools/tools/nightly
  KICAD_SRC: ${{ github.workspace }}
  # Dated releases are kept at least this many days (the retention guarantee in the README).
  KEEP_DAYS: "90"

jobs:
  # ------------------------------------------------------------------ what to build
  prepare:
    name: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.info.outputs.sha }}
      short: ${{ steps.info.outputs.short }}
      version: ${{ steps.info.outputs.version }}
      date: ${{ steps.info.outputs.date }}
      tag: ${{ steps.info.outputs.tag }}
      skip: ${{ steps.skip.outputs.skip }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      platforms: ${{ steps.matrix.outputs.platforms }}
    steps:
      - name: Check out the sources
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || env.NIGHTLY_REF }}
          # `git describe --match "[0-9]*"` (cmake/CreateGitVersionHeader.cmake) needs the
          # commit graph and the tags but no historic trees: a treeless clone is a fraction
          # of the full one.
          fetch-depth: 0
          filter: tree:0
          fetch-tags: true

      - name: Check out the tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: nightly-tools
          sparse-checkout: tools/nightly

      - name: Describe the commit
        id: info
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          short="${sha:0:10}"
          version="$(git describe --match '[0-9]*' --always)"
          date="$(date -u +%Y%m%d)"
          {
            echo "sha=$sha"
            echo "short=$short"
            echo "version=$version"
            echo "date=$date"
            echo "tag=nightly-${date}-${short}"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Select platforms
        id: matrix
        env:
          REQUESTED: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          bash "$NIGHTLY_TOOLS/matrix.sh" "$REQUESTED" | tee -a "$GITHUB_OUTPUT"

      - name: Skip when the rolling release already carries this commit
        id: skip
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force }}
          SHA: ${{ steps.info.outputs.sha }}
          PLATFORMS: ${{ steps.matrix.outputs.platforms }}
        run: |
          set -euo pipefail
          skip=false
          if [ "$FORCE" != "true" ] && gh release download nightly --pattern manifest.json --output manifest.json 2>/dev/null; then
            if python3 "$NIGHTLY_TOOLS/manifest.py" is-current manifest.json "$SHA" $PLATFORMS; then
              echo "nightly already carries $SHA for: $PLATFORMS"
              skip=true
            fi
          fi
          echo "skip=$skip" | tee -a "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------ build per platform
  build:
    name: build (${{ matrix.platform }})
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      NIGHTLY_PLATFORM: ${{ matrix.platform }}
      NIGHTLY_TAG: ${{ needs.prepare.outputs.tag }}
      NIGHTLY_VERSION: ${{ needs.prepare.outputs.version }}
      NIGHTLY_SHA: ${{ needs.prepare.outputs.sha }}
      BUILD_DIR: ${{ github.workspace }}/build/nightly
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
    steps:
      - name: Check out the sources
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          filter: tree:0
          fetch-tags: true

      - name: Check out the tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: nightly-tools
          sparse-checkout: tools/nightly

      # ---- compiler cache (Linux, macOS).  Restored and saved as two steps so that a job
      # which fails after the compile (bundle, smoke test) still keeps the objects it built;
      # actions/cache alone only saves when the job succeeds.
      - name: Restore ccache
        if: matrix.os != 'windows'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.platform }}-${{ needs.prepare.outputs.sha }}
          restore-keys: ccache-${{ matrix.platform }}-

      # ---- Linux
      - name: Install build dependencies (Linux)
        if: matrix.os == 'linux'
        run: sudo bash "$NIGHTLY_TOOLS/linux/install-deps.sh"

      - name: Build (Linux)
        if: matrix.os == 'linux'
        run: bash "$NIGHTLY_TOOLS/linux/build.sh"

      - name: Save ccache (Linux)
        if: matrix.os == 'linux' && always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.platform }}-${{ needs.prepare.outputs.sha }}

      - name: Bundle (Linux)
        if: matrix.os == 'linux'
        run: python3 "$NIGHTLY_TOOLS/linux/bundle.py" --build-dir "$BUILD_DIR" --src "$KICAD_SRC" --out dist/kicad-cli

      - name: Smoke test in a clean container (Linux)
        if: matrix.os == 'linux'
        run: bash "$NIGHTLY_TOOLS/linux/smoke-container.sh" dist/kicad-cli

      # ---- macOS
      - name: Install build dependencies (macOS)
        if: matrix.os == 'macos'
        run: bash "$NIGHTLY_TOOLS/macos/install-deps.sh"

      - name: Build (macOS)
        if: matrix.os == 'macos'
        run: bash "$NIGHTLY_TOOLS/macos/build.sh"

      - name: Save ccache (macOS)
        if: matrix.os == 'macos' && always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.platform }}-${{ needs.prepare.outputs.sha }}

      - name: Bundle (macOS)
        if: matrix.os == 'macos'
        run: bash "$NIGHTLY_TOOLS/macos/bundle.sh" "$BUILD_DIR" dist/kicad-cli

      # ---- Windows
      - name: Set up MSVC (Windows)
        if: matrix.os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up vcpkg (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: '& "$env:NIGHTLY_TOOLS/windows/setup-vcpkg.ps1"'

      # vcpkg's binary cache (the built ports) lives on the Actions cache so a cold run only
      # happens once.  The install step below has its own timeout and does not fail the job:
      # if the very first run cannot finish opencascade + wxWidgets + boost + icu inside it,
      # the cache still gets saved and the next nightly carries on from there.
      - name: Restore vcpkg binary cache (Windows)
        if: matrix.os == 'windows'
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-${{ matrix.platform }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'tools/custom_vcpkg_triplets/**', 'nightly-tools/tools/nightly/windows/triplets/**') }}
          restore-keys: vcpkg-${{ matrix.platform }}-

      - name: Install vcpkg dependencies (Windows)
        if: matrix.os == 'windows'
        id: vcpkg-install
        shell: pwsh
        timeout-minutes: 250
        continue-on-error: true
        run: '& "$env:NIGHTLY_TOOLS/windows/install-deps.ps1"'

      # A complete set of ports is saved under the exact key, so the next run with the same
      # vcpkg.json hits it and saves nothing; a partial set is saved under a per-run key that
      # the prefix in restore-keys finds next time.
      - name: Save vcpkg binary cache (Windows, complete)
        if: matrix.os == 'windows' && steps.vcpkg-install.outcome == 'success' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Save vcpkg binary cache (Windows, partial)
        if: matrix.os == 'windows' && always() && steps.vcpkg-install.outcome != 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}-partial-${{ github.run_id }}

      - name: Dependencies incomplete (Windows)
        if: matrix.os == 'windows' && steps.vcpkg-install.outcome != 'success'
        shell: bash
        run: |
          echo "::error::vcpkg install did not finish inside its time budget; the ports it built are cached, rerun the workflow to continue."
          exit 1

      - name: Build (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: '& "$env:NIGHTLY_TOOLS/windows/build.ps1"'

      - name: Bundle (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: '& "$env:NIGHTLY_TOOLS/windows/bundle.ps1" -BuildDir "$env:BUILD_DIR" -Out dist/kicad-cli'

      - name: Smoke test (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: bash "$NIGHTLY_TOOLS/smoke.sh" dist/kicad-cli/bin/kicad-cli.exe "$KICAD_SRC"

      # ---- archive + upload (all)
      - name: Archive
        shell: bash
        run: bash "$NIGHTLY_TOOLS/archive.sh" dist/kicad-cli "$NIGHTLY_PLATFORM" "$NIGHTLY_TAG" out

      - uses: actions/upload-artifact@v4
        with:
          name: kicad-cli-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------ publish
  release:
    name: release
    needs: [prepare, build]
    # Publish whatever built, even when one platform failed: the manifest says which
    # platforms are at which commit, and the rolling release keeps the previous asset for a
    # platform that did not build tonight.
    if: always() && needs.prepare.outputs.skip != 'true' && needs.build.result != 'cancelled' && needs.build.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: nightly-tools
          sparse-checkout: tools/nightly

      - uses: actions/download-artifact@v4
        with:
          pattern: kicad-cli-*
          path: assets
          merge-multiple: true

      - name: Publish releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NIGHTLY_TAG: ${{ needs.prepare.outputs.tag }}
          NIGHTLY_SHA: ${{ needs.prepare.outputs.sha }}
          NIGHTLY_VERSION: ${{ needs.prepare.outputs.version }}
          NIGHTLY_DATE: ${{ needs.prepare.outputs.date }}
          NIGHTLY_PLATFORMS: ${{ needs.prepare.outputs.platforms }}
          NIGHTLY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash "$NIGHTLY_TOOLS/release.sh" assets

      - name: Fail the run if a platform did not build
        if: needs.build.result != 'success'
        run: |
          echo "::error::at least one platform failed to build; the release carries the others"
          exit 1
