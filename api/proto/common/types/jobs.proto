syntax = "proto3";

package kiapi.common.types;

import "common/types/base_types.proto";

enum JobStatus
{
    JS_UNSPECIFIED = 0;
    JS_SUCCESS = 1;
    JS_WARNING = 2;
    JS_ERROR = 3;

    // The job was started asynchronously and has not finished; poll GetJobStatus with job_id
    // Since: 11.0
    JS_RUNNING = 4;
}

// A job output returned inline; see RunJobSettings.return_inline
// Since: 11.0
message JobOutputData
{
    // The output's path, as also listed in RunJobResponse.output_path
    string path = 1;

    bytes data = 2;
}

// Anti-aliasing mode for raster plot outputs
enum AntialiasingMode
{
    AAM_UNKNOWN = 0;
    // No anti-aliasing
    AAM_NONE = 1;
    // Anti-aliasing (KiCad currently has only one AA mode)
    AAM_STANDARD = 2;
}

message RunJobResponse
{
    JobStatus status = 1;

    // The path of the generated output (may not actually exist in the filesystem if the job failed)
    // May be a file, multiple files, or a directory depending on the context of the job
    repeated string output_path = 2;

    // Optional message containing warning or error details. Should be empty if status is JS_SUCCESS.
    string message = 3;

    // Identifier of the job, for GetJobStatus and JobProgress events
    // Since: 11.0
    string job_id = 4;

    // The outputs' contents, when RunJobSettings.return_inline was set and the job finished
    // Since: 11.0
    repeated JobOutputData inline_outputs = 5;
}

message RunJobSettings
{
    // The document on which the job should be run
    kiapi.common.types.DocumentSpecifier document = 1;

    // The path where the job's output should be saved
    // May be a file or a directory depending on the context of the job
    string output_path = 2;

    // Return as soon as the job is queued, with status JS_RUNNING and job_id set.  Progress is
    // published as JobProgress events and the result is available from GetJobStatus.  Honored by
    // kicad-cli api-server; an editor window runs the job synchronously regardless.
    // Since: 11.0
    bool async = 3;

    // Also return the output files' contents in RunJobResponse.inline_outputs (files up to
    // 16 MiB each; directory outputs contribute the files directly inside them)
    // Since: 11.0
    bool return_inline = 4;
}
