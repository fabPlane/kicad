/*
 * library_commands.proto
 * Commands and responses related to library management
 */

syntax = "proto3";

package kiapi.common.commands;

import "common/types/base_types.proto";
import "common/types/library_types.proto";
import "common/types/wizards.proto";
import "board/board_types.proto";
import "schematic/schematic_types.proto";
import "google/protobuf/any.proto";

/*
 * Library table management
 */

// Returns LibraryTableResponse
// Since: 11.0
message GetLibraryTable
{
  // Which type of table (symbol, footprint, design block) to query
  kiapi.common.types.LibraryType type = 1;

  // Which table scope (global, project, or both)
  kiapi.common.types.LibraryTableScope scope = 2;

  // If true, return URIs with environment variables expanded
  bool substituted = 3;
}

// Since: 11.0
message LibraryTableResponse
{
  // The table that was queried
  kiapi.common.types.LibraryTable table = 1;

  repeated kiapi.common.types.LibraryTableEntry rows = 2;
}

// Inserts a new row into the given library table.
// Returns LibraryCommandStatus
// Since: 11.0
message AddLibraryTableEntry
{
  kiapi.common.types.LibraryTableEntry entry = 1;

  // Which table to modify.  LTS_BOTH is invalid here.
  kiapi.common.types.LibraryTableScope scope = 2;
}

// Modifies an existing row, matched by entry.nickname (and scope).
// Returns LibraryCommandStatus
// Since: 11.0
message UpdateLibraryTableEntry
{
  kiapi.common.types.LibraryTableEntry entry = 1;

  // Which table to modify.  LTS_BOTH is invalid here.
  kiapi.common.types.LibraryTableScope scope = 2;
}

// Deletes a row from the given library table by nickname.
// Returns LibraryCommandStatus
// Since: 11.0
message DeleteLibraryTableEntry
{
  // Which table type (symbol, footprint, design block) contains the row
  kiapi.common.types.LibraryType type = 1;

  string nickname = 2;

  // Which table to modify.  LTS_BOTH is invalid here.
  kiapi.common.types.LibraryTableScope scope = 3;
}

/*
 * Library management
 */

// Queries the load status of each library of the given type(s)
// Returns LibraryStatusResponse
// Since: 11.0
message GetLibraryStatuses
{
  // Types to query; empty means all types
  repeated kiapi.common.types.LibraryType types = 1;

  // Which table scope(s) to query
  kiapi.common.types.LibraryTableScope scope = 2;
}

// Since: 11.0
message LibraryStatusResponse
{
  repeated kiapi.common.types.LibraryStatusEntry libraries = 1;
}

// Reloads library table row(s) from disk.  This starts a reload process that operates
// asynchronously.  The API command will return immediately but updated library content
// will not be available until the load has completed.
// Returns LibraryCommandStatus
// Since: 11.0
message ReloadLibrary
{
  // Type of library to reload
  kiapi.common.types.LibraryType type = 1;

  // Which table to look up the library in.  LTS_BOTH is invalid here.
  kiapi.common.types.LibraryTableScope scope = 2;

  // List of libraries to reload. If absent, all libraries matching type and scope will be reloaded.
  repeated string nickname = 3;
}

// Starts a background load of all libraries of the given types that are listed in the
// library tables.  If no types are given, all library types are loaded.  The command
// returns immediately and the load proceeds asynchronously; progress can be monitored
// with GetLibraryStatuses.
// In GUI mode this command is a no-op, because the GUI preloads libraries on its own.
// Returns LibraryCommandStatus
// Since: 11.0
message LoadAllLibraries
{
  // Types of libraries to load; empty means all types
  repeated kiapi.common.types.LibraryType type = 1;
}

/*
 * Library queries
 */

// Requests items contained in a library or set of libraries
// Returns LibraryItemsResponse
// Since: 11.0
message GetLibraryItems
{
  kiapi.common.types.LibraryType type = 1;

  // The library or libraries to query.
  repeated string nickname = 2;
}

// Since: 11.0
message LibraryItemsResponse
{
  // The identifiers of all content in the library
  repeated kiapi.common.types.LibraryIdentifier items = 1;
}

// Requests the full content of items contained in a library or set of libraries
// Returns GetItemsResponse
// Since: 11.0
message GetItemsFromLibrary
{
  // The type of library to query (symbol, footprint, design block).
  kiapi.common.types.LibraryType type = 1;

  // Which document context to use (to enable querying project-specific libraries)
  kiapi.common.types.DocumentSpecifier document = 2;

  // The items to retrieve.
  repeated kiapi.common.types.LibraryIdentifier item_ids = 3;
}

// Requests items matching a search query in the given library scopes
// Returns SearchLibrariesResponse
// Since: 11.0
message SearchLibraries
{
  kiapi.common.types.LibraryType type = 1;

  // Glob pattern or substring to match against item names.  Follows the same logic
  // of KiCad's library chooser filter
  string query = 2;
}

// Since: 11.0
message SearchLibrariesResponse
{
  // The identifiers of matching content
  repeated kiapi.common.types.LibraryIdentifier items = 1;
}

// Since: 11.0
message PlaceFromLibraryResponse
{
  kiapi.common.types.ItemHeader header = 1;

  // The newly-created item
  google.protobuf.Any item = 2;
}

/*
 * FabPlane series: library tables, entry listings, reading/writing library items and wizards.
 *
 * These commands are served once a project is open (the library tables are project-scoped).
 * A command names the library type it addresses so that one nickname may exist in more than
 * one table; the handler for another type answers AS_UNHANDLED and the request moves on.
 *
 * Since 11.0
 */


// One row of a library table (sym-lib-table, fp-lib-table, design-block-lib-table)
// Since 11.0
message LibraryTableRow
{
  string nickname = 1;

  // The URI as written in the table; may contain ${VARIABLE} references
  string uri = 2;

  // Plugin type name, for example "KiCad"
  string type = 3;

  // Plugin options string, for example "key=value|key2=value2"
  string options = 4;

  string description = 5;

  kiapi.common.types.LibraryTableScope scope = 6;

  // False when the row is disabled in the table
  bool enabled = 7;

  // True when the row is hidden from library browsers
  bool hidden = 8;

  // False when the table could not resolve or validate the row; see error
  bool ok = 9;

  string error = 10;

  // The URI with environment and project variables expanded.  Only set in responses.
  string resolved_uri = 11;
}

// Lists the rows of the global and project library tables of the given type.
// Returns GetLibraryTablesResponse
// Since 11.0
message GetLibraryTables
{
  kiapi.common.types.LibraryType type = 1;

  // Restrict to one scope; LTS_UNKNOWN (the default) returns both, global rows first
  kiapi.common.types.LibraryTableScope scope = 2;
}

// Since 11.0
message GetLibraryTablesResponse
{
  repeated LibraryTableRow rows = 1;
}

// Footprint-specific summary of a library entry
// Since 11.0
message FootprintEntryInfo
{
  uint32 pad_count = 1;

  // Pads with distinct numbers
  uint32 unique_pad_count = 2;

  kiapi.board.types.FootprintMountingStyle mounting_style = 3;

  // File names of the 3D models attached to the footprint
  repeated string models = 4;
}

// Symbol-specific summary of a library entry
// Since 11.0
message SymbolEntryInfo
{
  uint32 unit_count = 1;

  bool is_power = 2;

  repeated string footprint_filters = 3;

  // Set when the symbol derives from another symbol in the same library
  string parent_name = 4;

  // Default footprint from the symbol's Footprint field
  string footprint = 5;
}

// Since 11.0
message LibraryEntry
{
  kiapi.common.types.LibraryIdentifier id = 1;

  string name = 2;

  string description = 3;

  string keywords = 4;

  oneof info
  {
    FootprintEntryInfo footprint = 5;
    SymbolEntryInfo symbol = 6;
  }
}

// Lists the entries of one library.  The library is loaded on demand, so the first call for a
// large library may take a while.
// Returns ListLibraryEntriesResponse
// Since 11.0
message ListLibraryEntries
{
  kiapi.common.types.LibraryType type = 1;

  string nickname = 2;

  // Case-insensitive substring filter applied to the entry name, description, and keywords;
  // empty returns every entry
  string filter = 3;
}

// Since 11.0
message ListLibraryEntriesResponse
{
  repeated LibraryEntry entries = 1;
}

// Loads one library item.  Returns GetLibraryItemResponse
// Since 11.0
message GetLibraryItem
{
  kiapi.common.types.LibraryType type = 1;

  kiapi.common.types.LibraryIdentifier id = 2;
}

// Since 11.0
message LibraryItem
{
  oneof item
  {
    // The library definition of a footprint
    kiapi.board.types.Footprint footprint = 1;

    // The library definition of a symbol, in the same form a DOCTYPE_SYMBOL document serves
    kiapi.schematic.types.SchematicSymbol symbol = 2;
  }
}

// Since 11.0
message GetLibraryItemResponse
{
  kiapi.common.types.LibraryIdentifier id = 1;

  LibraryItem item = 2;
}

// Writes an item into a library.  The item's own id (if any) is ignored; the destination is
// taken from id, whose entry_name may be empty to keep the item's name.
// Returns SaveLibraryItemResponse
// Since 11.0
message SaveLibraryItem
{
  kiapi.common.types.LibraryType type = 1;

  kiapi.common.types.LibraryIdentifier id = 2;

  LibraryItem item = 3;

  // Replace an existing entry of the same name; when false, an existing entry is an error
  bool overwrite = 4;
}

// Since 11.0
message SaveLibraryItemResponse
{
  // The id the item was written under
  kiapi.common.types.LibraryIdentifier id = 1;
}

// Deletes an item from a writable library.
// Since 11.0
message DeleteLibraryItem
{
  kiapi.common.types.LibraryType type = 1;

  kiapi.common.types.LibraryIdentifier id = 2;
}

// Creates an empty library on disk and adds a row for it to the given table.  The uri is used
// as written (it may contain ${KIPRJMOD} and other variables); when empty, a KiCad-format
// library named after the nickname is created in the project folder (project scope) or the
// user's documents folder (global scope).
// Returns LibraryTableRow
// Since 11.0
message CreateLibrary
{
  kiapi.common.types.LibraryType type = 1;

  string nickname = 2;

  string uri = 3;

  kiapi.common.types.LibraryTableScope scope = 4;

  string description = 5;
}

// Adds (or, when a row with the nickname exists and replace is set, replaces) a row in the
// global or project library table and saves the table.  The library is not created on disk.
// Returns LibraryTableRow
// Since 11.0
message AddLibraryTableRow
{
  kiapi.common.types.LibraryType type = 1;

  kiapi.common.types.LibraryTableScope scope = 2;

  // scope, ok and error are ignored; type defaults to "KiCad" when empty
  LibraryTableRow row = 3;

  bool replace = 4;
}

// Removes a row from the global or project library table and saves the table.  The library
// files are left in place.
// Since 11.0
message RemoveLibraryTableRow
{
  kiapi.common.types.LibraryType type = 1;

  kiapi.common.types.LibraryTableScope scope = 2;

  string nickname = 3;
}

// Lists the footprint wizards available to this KiCad instance.
// Returns ListWizardsResponse
// Since 11.0
message ListWizards
{
}

// Since 11.0
message ListWizardsResponse
{
  repeated kiapi.common.types.WizardInfo wizards = 1;
}

// Runs a footprint wizard with the given parameter values (parameters not listed keep their
// defaults).  Returns kiapi.common.types.WizardGeneratedContent whose content is a
// kiapi.board.types.Footprint.
// Since 11.0
message RunWizard
{
  // WizardMetaInfo.identifier from ListWizards
  string identifier = 1;

  kiapi.common.types.WizardParameterList parameters = 2;
}
